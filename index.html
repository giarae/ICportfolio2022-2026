    <style>
        body {
            background-color: #f6fafe; /* Matches your current background */
            font-family: "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* The main wooden-style board container */
        .portfolio-board {
            background-color: #e5a05d; /* Cozy wood color */
            border: 8px solid #3f0f08; /* Dark border */
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #3f0f08;
            font-size: 24px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Stylized "paper note" buttons */
        .portfolio-link {
            display: block;
            background-color: #fdfaeb; /* Off-white paper color */
            border: 3px solid #3f0f08;
            border-radius: 6px;
            padding: 15px;
            margin: 15px 0;
            color: #3f0f08;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, background-color 0.2s;
        }

        /* Hover effect to make it feel tactile */
        .portfolio-link:hover {
            background-color: #fff0ba; /* Warm highlight yellow */
            transform: scale(1.03);
            text-decoration: none;
            color: #5b2b2a;
        }
    </style>
</head>
